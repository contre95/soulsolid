{{- $move := .Config.Import.Move -}}
{{- $queue := .Config.Import.AlwaysQueue -}}
{{- $dup := .Config.Import.Duplicates -}}
      <!-- Clicking a badge toggles/cycles its option and saves it to config.yaml (same as Settings); badges re-render via importOptionsChanged -->
      <!-- Move/Copy Badge -->
      <button type="button" title="Click to switch between move and copy"
              hx-put="/config/import" hx-target="#toast-container" hx-swap="innerHTML"
              hx-vals='{"import.move": "{{if $move}}false{{else}}true{{end}}", "import.always_queue": "{{$queue}}", "import.duplicates": "{{$dup}}"}'
              hx-on:htmx:response-error="showErrToast(new DOMParser().parseFromString(event.detail.xhr.responseText, 'text/html').querySelector('p')?.textContent?.trim() || 'Failed to save')"
              class="group inline-flex items-center px-3 py-1.5 rounded-lg text-xs font-medium tracking-wider cursor-pointer transition-all duration-300 ease-out-expo hover:-translate-y-0.5 {{if $move}}bg-red-500/10 backdrop-blur-md border border-red-400/30 text-red-600 dark:text-red-300 shadow-lg shadow-red-500/10 hover:shadow-red-500/20{{else}}bg-blue-500/10 backdrop-blur-md border border-blue-400/30 text-blue-600 dark:text-blue-300 shadow-lg shadow-blue-500/10 hover:shadow-blue-500/20{{end}}">
        <span class="flex items-center">
          <span class="font-semibold">{{if $move}}MOVE{{else}}COPY{{end}}</span>
        </span>
      </button>

      <!-- Always Queue Badge (crossed out when off) -->
      <button type="button" title="Click to turn always queue {{if $queue}}off{{else}}on{{end}}" aria-pressed="{{$queue}}"
              hx-put="/config/import" hx-target="#toast-container" hx-swap="innerHTML"
              hx-vals='{"import.move": "{{$move}}", "import.always_queue": "{{if $queue}}false{{else}}true{{end}}", "import.duplicates": "{{$dup}}"}'
              hx-on:htmx:response-error="showErrToast(new DOMParser().parseFromString(event.detail.xhr.responseText, 'text/html').querySelector('p')?.textContent?.trim() || 'Failed to save')"
              class="inline-flex items-center px-3 py-1.5 rounded-lg text-xs font-medium tracking-wider cursor-pointer transition-all duration-300 ease-out-expo hover:-translate-y-0.5 {{if $queue}}bg-yellow-500/10 backdrop-blur-md border border-yellow-400/30 text-yellow-600 dark:text-yellow-300 shadow-lg shadow-yellow-500/10 hover:shadow-yellow-500/20{{else}}bg-gray-500/10 backdrop-blur-md border border-gray-400/30 text-gray-500 dark:text-gray-400 opacity-70 hover:opacity-100{{end}}">
        <span class="flex items-center">
          <span class="font-semibold {{if not $queue}}line-through{{end}}">ALWAYS QUEUE</span>
        </span>
      </button>

      <!-- Duplicates Badge (cycles replace → skip → queue) -->
      <button type="button" title="Click to cycle duplicate handling (replace, skip, queue)"
              hx-put="/config/import" hx-target="#toast-container" hx-swap="innerHTML"
              hx-vals='{"import.move": "{{$move}}", "import.always_queue": "{{$queue}}", "import.duplicates": "{{if eq $dup "replace"}}skip{{else if eq $dup "skip"}}queue{{else}}replace{{end}}"}'
              hx-on:htmx:response-error="showErrToast(new DOMParser().parseFromString(event.detail.xhr.responseText, 'text/html').querySelector('p')?.textContent?.trim() || 'Failed to save')"
              class="group inline-flex items-center px-3 py-1.5 rounded-lg text-xs font-medium tracking-wider cursor-pointer transition-all duration-300 ease-out-expo hover:-translate-y-0.5 {{if eq $dup "skip"}}bg-sky-400/10 backdrop-blur-md border border-sky-300/30 text-sky-600 dark:text-sky-300 shadow-lg shadow-sky-400/10 hover:shadow-sky-400/20{{else if eq $dup "replace"}}bg-orange-500/10 backdrop-blur-md border border-orange-400/30 text-orange-600 dark:text-orange-300 shadow-lg shadow-orange-500/10 hover:shadow-orange-500/20{{else if eq $dup "queue"}}bg-violet-500/10 backdrop-blur-md border border-violet-400/30 text-violet-600 dark:text-violet-300 shadow-lg shadow-violet-500/10 hover:shadow-violet-500/20{{else}}bg-green-500/10 backdrop-blur-md border border-green-400/30 text-green-600 dark:text-green-300 shadow-lg shadow-green-500/10 hover:shadow-green-500/20{{end}}">
        <span class="flex items-center">
          <span class="uppercase tracking-tight font-normal opacity-90 group-hover:opacity-100 transition-opacity">DUP. {{$dup}}</span>
        </span>
      </button>
