  <div id="library-table">
   <!-- Search Form -->
   <form id="search-form" class="p-6 border-b border-gray-200/50 dark:border-gray-700/50" onsubmit="return false;"
         hx-get="/library/search" hx-trigger="libsearch" hx-target="#search-results" hx-swap="innerHTML">
     <!-- Library view (tracks / albums). The hidden input is sent with every search request. -->
     <input type="hidden" id="library-view" name="view" value="tracks">

     <!-- Text search row: search box + view toggle -->
     <div class="flex flex-col md:flex-row md:items-end gap-3 mb-4">
       <div class="flex-1">
         <label for="search-query" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
           <i class="fas fa-search mr-2 text-blue-500"></i>Search Library
         </label>
         <input type="text"
                id="search-query"
                name="query"
                placeholder="Search artists, albums, tracks..."
                class="w-full px-3 py-2 text-sm border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-800 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200"
                hx-get="/library/search"
                hx-trigger="input changed delay:300ms"
                hx-target="#search-results"
                hx-swap="innerHTML"
                hx-include="closest form">
       </div>

       <div class="inline-flex h-10 self-start md:self-auto flex-shrink-0 whitespace-nowrap rounded-md border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 overflow-hidden divide-x divide-gray-300 dark:divide-gray-600"
            role="group" aria-label="Library view">
         <button type="button" id="lib-view-tracks" aria-pressed="true" title="Browse tracks"
                 class="cursor-pointer inline-flex items-center h-full px-3 text-sm font-medium transition-colors text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white hover:bg-gray-50 dark:hover:bg-gray-700/50 aria-pressed:bg-blue-500/10 aria-pressed:text-blue-600 aria-pressed:dark:bg-blue-500/20 aria-pressed:dark:text-blue-300 focus:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-blue-500"
                 _="on click
                      if #library-view.value is 'tracks' exit end
                      set #library-view.value to 'tracks'
                      set @aria-pressed of #lib-view-albums to 'false'
                      set @aria-pressed of me to 'true'
                      remove .hidden from .lib-track-filter
                      add .hidden to .lib-album-filter
                      set #search-query.placeholder to 'Search artists, albums, tracks...'
                      send libsearch to #search-form">
           <i class="fas fa-music mr-2 text-xs"></i>Tracks
         </button>
         <button type="button" id="lib-view-albums" aria-pressed="false" title="Browse albums"
                 class="cursor-pointer inline-flex items-center h-full px-3 text-sm font-medium transition-colors text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white hover:bg-gray-50 dark:hover:bg-gray-700/50 aria-pressed:bg-blue-500/10 aria-pressed:text-blue-600 aria-pressed:dark:bg-blue-500/20 aria-pressed:dark:text-blue-300 focus:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-blue-500"
                 _="on click
                      if #library-view.value is 'albums' exit end
                      set #library-view.value to 'albums'
                      set @aria-pressed of #lib-view-tracks to 'false'
                      set @aria-pressed of me to 'true'
                      add .hidden to .lib-track-filter
                      remove .hidden from .lib-album-filter
                      set #search-query.placeholder to 'Search albums or album artists...'
                      send libsearch to #search-form">
           <i class="fas fa-compact-disc mr-2 text-xs"></i>Albums
         </button>
       </div>
     </div>

     <!-- Filter row -->
     <div class="flex flex-wrap gap-3 items-end">
       <!-- Genre dropdown -->
       <div class="min-w-32">
         <label for="genre" class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Genre</label>
         <select id="genre" name="genre"
                 class="w-full px-2 py-1.5 text-sm border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                 hx-get="/library/search"
                 hx-trigger="change"
                 hx-target="#search-results"
                 hx-swap="innerHTML"
                 hx-include="closest form">
           <option value="">All genres</option>
           {{range .Genres}}
           <option value="{{.}}">{{.}}</option>
           {{end}}
         </select>
       </div>

       <!-- Album sort (albums view only) -->
       <div class="lib-album-filter hidden min-w-40">
         <label for="album_sort" class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Sort albums by</label>
         <select id="album_sort" name="album_sort"
                 class="w-full px-2 py-1.5 text-sm border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                 hx-get="/library/search"
                 hx-trigger="change"
                 hx-target="#search-results"
                 hx-swap="innerHTML"
                 hx-include="closest form">
           <option value="artist">Artist</option>
           <option value="title">Title</option>
           <option value="year">Year (newest first)</option>
           <option value="recent">Recently added</option>
         </select>
       </div>

       <!-- Lyrics filter dropdown -->
       <div class="lib-track-filter min-w-36">
         <label for="lyrics_filter" class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Lyrics</label>
         <select id="lyrics_filter" name="lyrics_filter"
                 class="w-full px-2 py-1.5 text-sm border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                 hx-get="/library/search"
                 hx-trigger="change"
                 hx-target="#search-results"
                 hx-swap="innerHTML"
                 hx-include="closest form">
           <option value="">Any</option>
           <option value="has">Has lyrics</option>
           <option value="empty">Empty lyrics</option>
           <option value="instrumental">Instrumental</option>
         </select>
       </div>

       <!-- Lyrics text search -->
       <div class="lib-track-filter flex-1 min-w-40">
         <label for="lyrics_text" class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Lyrics contain</label>
         <input type="text"
                id="lyrics_text"
                name="lyrics_text"
                placeholder="Search in lyrics..."
                class="w-full px-2 py-1.5 text-sm border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-800 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500"
                hx-get="/library/search"
                hx-trigger="input changed delay:400ms"
                hx-target="#search-results"
                hx-swap="innerHTML"
                hx-include="closest form">
       </div>

       <!-- Added after -->
       <div class="lib-track-filter flex-1 min-w-36">
         <label for="added_after" class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Added after</label>
         <input type="date"
                id="added_after"
                name="added_after"
                class="w-full px-2 py-1.5 text-sm border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                hx-get="/library/search"
                hx-trigger="change"
                hx-target="#search-results"
                hx-swap="innerHTML"
                hx-include="closest form">
       </div>

       <!-- Added before -->
       <div class="lib-track-filter flex-1 min-w-36">
         <label for="added_before" class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Added before</label>
         <input type="date"
                id="added_before"
                name="added_before"
                class="w-full px-2 py-1.5 text-sm border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                hx-get="/library/search"
                hx-trigger="change"
                hx-target="#search-results"
                hx-swap="innerHTML"
                hx-include="closest form">
       </div>

       <!-- AcoustID checkbox -->
       <div class="lib-track-filter flex items-center gap-4 pb-1.5">
         <label class="flex items-center gap-2 text-sm text-gray-700 dark:text-gray-300 cursor-pointer select-none">
           <input type="checkbox"
                  name="has_acoustid"
                  value="true"
                  class="w-4 h-4 rounded border-gray-300 dark:border-gray-600 text-blue-600 focus:ring-blue-500"
                  hx-get="/library/search"
                  hx-trigger="change"
                  hx-target="#search-results"
                  hx-swap="innerHTML"
                  hx-include="closest form">
           Has AcoustID
         </label>
       </div>
     </div>
   </form>

   <!-- Library Search Results -->
   <div class="py-6 px-2">
     <div id="search-results" hx-get="/library/search" hx-trigger="load" hx-swap="innerHTML">
       <div class="text-center py-8">
         <svg class="w-12 h-12 text-gray-400 dark:text-gray-500 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
           <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
         </svg>
         <p class="text-gray-500 dark:text-gray-400">Loading tracks...</p>
       </div>
     </div>
   </div>
</div>
