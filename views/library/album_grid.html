{{if .Albums}}
{{template "pagination_bar" .}}

<div class="mt-2 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 2xl:grid-cols-6 gap-4">
  {{$page := .Pagination.Page}}
  {{range .Albums}}
  <button type="button"
          class="group text-left cursor-pointer rounded-lg p-2 transition-colors hover:bg-gray-100 dark:hover:bg-neutral-800/60 focus:outline-none focus-visible:ring-2 focus-visible:ring-purple-500"
          hx-get="/library/albums/{{.ID}}/view?page={{$page}}" hx-target="#search-results" hx-swap="innerHTML show:#library-table:top"
          title="{{.Title}}{{if .Artists}} — {{.Artists}}{{end}}">
    <!-- Cover: gradient + icon underneath, artwork on top when the first track has one -->
    <span class="relative block aspect-square w-full rounded-md overflow-hidden shadow bg-gradient-to-br from-purple-400 to-fuchsia-600">
      <span class="absolute inset-0 flex items-center justify-center">
        <i class="fas fa-compact-disc text-4xl text-white/80"></i>
      </span>
      {{if .CoverTrackID}}
      <img src="/tag/{{.CoverTrackID}}/artwork" alt="" loading="lazy"
           class="absolute inset-0 w-full h-full object-cover transition-transform duration-300 group-hover:scale-105"
           onerror="this.remove()">
      {{end}}
    </span>
    <span class="block mt-2 truncate text-sm font-medium text-gray-900 dark:text-white">{{.Title}}</span>
    <span class="block truncate text-xs text-gray-500 dark:text-gray-400">{{if .Artists}}{{.Artists}}{{else}}Unknown artist{{end}}</span>
    <span class="block truncate text-xs text-gray-400 dark:text-gray-500 tabular-nums">
      {{if .Year}}{{.Year}} · {{end}}{{.TrackCount}} {{if eq .TrackCount 1}}track{{else}}tracks{{end}}
    </span>
  </button>
  {{end}}
</div>

<div class="mt-3">{{template "pagination_bar" .}}</div>

{{else if .Filtered}}
<div class="text-center py-16">
  <i class="fas fa-magnifying-glass text-4xl text-gray-300 dark:text-gray-600 mb-3"></i>
  <p class="text-gray-500 dark:text-gray-400">No albums match {{if .Query}}"{{.Query}}"{{else}}these filters{{end}}</p>
</div>
{{else}}
<div class="text-center py-16">
  <i class="fas fa-compact-disc text-4xl text-gray-300 dark:text-gray-600 mb-3"></i>
  <p class="text-gray-500 dark:text-gray-400">No albums in your library yet</p>
</div>
{{end}}
