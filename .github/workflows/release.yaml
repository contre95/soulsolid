name: Release
on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Release-please builds the GitHub release notes from the CHANGELOG entry,
      # not from the PR description, so the header is added to both: the release
      # PR (above the first `---`, which release-please ignores) and the release.
      - name: Build release header
        if: steps.rp.outputs.pr || steps.rp.outputs.release_created
        env:
          PR: ${{ steps.rp.outputs.pr }}
          TAG: ${{ steps.rp.outputs.tag_name }}
        run: |
          version=${TAG:-v$(jq -r .title <<<"$PR" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+[^ ]*$')}
          cat > "$RUNNER_TEMP/header.md" <<EOF
          # <img src="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/public/img/galaxy.png" width="48" alt="soulsolid"> Soulsolid

          🐳 Pull the image from [Docker Hub](https://hub.docker.com/r/contre95/soulsolid/tags):

          \`\`\`sh
          podman pull docker.io/contre95/soulsolid:${version}
          \`\`\`
          EOF

      - name: Brand release PR description
        if: steps.rp.outputs.pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.rp.outputs.pr }}
        run: |
          number=$(jq -r .number <<<"$PR")
          gh pr view "$number" -R "$GITHUB_REPOSITORY" --json body -q .body \
            | awk -v h="$RUNNER_TEMP/header.md" 'NR==1 {while ((getline l < h) > 0) print l} /^---$/ {f=1} f' \
            | gh pr edit "$number" -R "$GITHUB_REPOSITORY" --body-file -

      - name: Brand release notes
        if: steps.rp.outputs.release_created
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rp.outputs.tag_name }}
        run: |
          { cat "$RUNNER_TEMP/header.md"; echo; gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json body -q .body; } \
            | gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file -

  build-and-push:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Set up Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
      - name: Login to DockerHub
        run: |
          podman login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }} docker.io
      - name: Build and push Container image
        run: |
          version=${{ needs.release-please.outputs.tag_name }}
          podman image build --build-arg IMAGE_TAG=$version -t contre95/soulsolid:$version .
          podman push contre95/soulsolid:$version

          podman tag contre95/soulsolid:$version contre95/soulsolid:beta
          podman push contre95/soulsolid:beta

          podman tag contre95/soulsolid:$version contre95/soulsolid:latest
          podman push contre95/soulsolid:latest

  # Discord doesn't render HTML, so the same template is rebuilt as an embed:
  # logo as the author icon, headings turned into bold lines.
  announce-discord:
    needs: [release-please, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Post release to Discord
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "DISCORD_WEBHOOK not set, skipping"; exit 0; fi
          release=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json body,url)
          changelog=$(jq -r .body <<<"$release" | awk '/^## \[/ {f=1} f' | sed -E 's/^#+ (.*)/**\1**/')
          description=$(printf '🐳 Pull the image from [Docker Hub](https://hub.docker.com/r/contre95/soulsolid/tags):\n```sh\npodman pull docker.io/contre95/soulsolid:%s\n```\n%s' "$TAG" "$changelog")
          jq -n \
            --arg url "$(jq -r .url <<<"$release")" \
            --arg logo "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/public/img/galaxy.png" \
            --arg description "${description:0:4000}" \
            '{username: "Soulsolid", avatar_url: $logo, embeds: [{
              author: {name: "Soulsolid", icon_url: $logo, url: $url},
              url: $url, description: $description, color: 7506394}]}' \
            | curl -fsS -H 'Content-Type: application/json' -d @- "$WEBHOOK"
