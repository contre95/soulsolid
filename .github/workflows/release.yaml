name: Release
on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Replace the header (everything above the first `---`) with the logo and
      # version. Release-please only parses the notes below `---`, so this is safe.
      - name: Brand release PR description
        if: steps.rp.outputs.pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.rp.outputs.pr }}
        run: |
          number=$(jq -r .number <<<"$PR")
          version=$(jq -r .title <<<"$PR" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+[^ ]*$')
          # GitHub strips inline styles, so the gray version uses math (\color).
          export HEADER="# <img src=\"https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/public/img/galaxy.png\" width=\"48\" alt=\"soulsolid\"> Soulsolid \$\\color{gray}\\textsf{v${version}}\$"
          HEADER+=$'\n\n'"🐳 Once released, pull the image from [Docker Hub](https://hub.docker.com/r/contre95/soulsolid/tags):"
          HEADER+=$'\n\n```sh\npodman pull docker.io/contre95/soulsolid:'"v${version}"$'\n```'
          gh pr view "$number" -R "$GITHUB_REPOSITORY" --json body -q .body \
            | awk 'NR==1 {print ENVIRON["HEADER"]} /^---$/ {f=1} f' \
            | gh pr edit "$number" -R "$GITHUB_REPOSITORY" --body-file -

  build-and-push:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Set up Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
      - name: Login to DockerHub
        run: |
          podman login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }} docker.io
      - name: Build and push Container image
        run: |
          version=${{ needs.release-please.outputs.tag_name }}
          podman image build --build-arg IMAGE_TAG=$version -t contre95/soulsolid:$version .
          podman push contre95/soulsolid:$version

          podman tag contre95/soulsolid:$version contre95/soulsolid:beta
          podman push contre95/soulsolid:beta

          podman tag contre95/soulsolid:$version contre95/soulsolid:latest
          podman push contre95/soulsolid:latest
